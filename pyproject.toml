[tool.poetry]
name = "mcp-behavioral-prompts"
version = "1.1.0"
description = "MCP server with behavioral prompts and the Brainer STEM tutor stack (solver + socratic tutor + vision + eval)."
authors = ["VerifyLoop"]
readme = "README.md"
packages = [
    {include = "mcp_prompts_server", from = "src"},
    {include = "brainer_stem_tutor", from = "src"},
]

[tool.poetry.dependencies]
python = "^3.10"
mcp = {extras = ["cli"], version = "^1.2.0"}
pydantic = "^2.7"
pydantic-settings = "^2.3.4"
colorlog = "^6.8.2"
sympy = "^1.12"
pint = "^0.23"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
pytest-asyncio = "^0.23.7"
pytest-cov = "^5.0"
ruff = "^0.5"
mypy = "^1.10"
fastapi = "^0.112"
httpx = "^0.27"

[tool.poetry.scripts]
brainer-tutor-eval = "brainer_stem_tutor.eval.cli:main"
brainer-tutor-demo = "brainer_stem_tutor.demo:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning:pydantic",
]

[tool.coverage.run]
branch = true
source = ["brainer_stem_tutor"]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",  # line too long; pyproject.toml caps it differently
    "B008",  # function call in default arg — fine for FastAPI deps
    "UP007", # PEP 604 union types not always available on 3.10
]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
disallow_untyped_defs = false
ignore_missing_imports = true
check_untyped_defs = true
files = "src/brainer_stem_tutor"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
