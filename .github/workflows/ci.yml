name: ci

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic 'pydantic-settings>=2.3' sympy pint pytest 'pytest-asyncio>=0.23' colorlog fastapi httpx
      - name: Run tests
        run: PYTHONPATH=src python -m pytest -q
      - name: Run eval CI gates
        run: PYTHONPATH=src python -m brainer_stem_tutor.eval.cli --dataset smoke --tutor --ci
