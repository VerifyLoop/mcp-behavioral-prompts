name: ci

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  lint-and-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install lint deps
        run: pip install ruff mypy pydantic 'pydantic-settings>=2.3' sympy pint
      - name: Ruff
        run: ruff check src/brainer_stem_tutor
      - name: Mypy
        run: mypy src/brainer_stem_tutor

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic 'pydantic-settings>=2.3' sympy pint pytest 'pytest-asyncio>=0.23' pytest-cov colorlog fastapi httpx
      - name: Run tests with coverage
        run: PYTHONPATH=src python -m pytest --cov --cov-fail-under=85
      - name: Run eval CI gates
        run: PYTHONPATH=src python -m brainer_stem_tutor.eval.cli --dataset smoke --tutor --ci
