[tool.poetry]
name = "social-trends-mcp"
version = "0.1.0"
description = "Aggregation MCP server + CLI for social trends (TikTok, Instagram, Twitch, ...). Fronts Apify, Bright Data, ScrapeCreators and the Twitch CLI behind canonical tools."
authors = ["VerifyLoop"]
readme = "README.md"
license = "MIT"
packages = [{include = "social_trends", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
mcp = {extras = ["cli"], version = "^1.2.0"}
pydantic = "^2.7"
pydantic-settings = "^2.3"
typer = "^0.12"
httpx = "^0.27"
rich = "^13.7"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"

[tool.poetry.scripts]
social-trends = "social_trends.cli:app"
social-trends-mcp = "social_trends.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
